<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="940" height="600" viewBox="0 0 940 600" role="img"
         aria-label="Three raw city snapshots flow through io, anonymize and clean inside the data/build.py orchestrator, past three cross-frame gates, into three processed parquet files.">
      <defs>
        <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z"></path>
        </marker>
      </defs>

      <text class="cap" x="25" y="16">data/raw/&lt;city&gt;/&lt;release&gt;/ — immutable · fetched + sha256-manifested by download.py · registered as Azure assets raw-&lt;city&gt;</text>

      <rect class="box-art" x="25" y="28" width="270" height="78" rx="6"></rect>
      <text class="st at" x="41" y="50">thessaloniki · 2026-06-29</text>
      <text class="sl" x="41" y="70">4,965 listings</text>
      <text class="sm" x="41" y="88">listings · calendar · reviews · nbhds</text>

      <rect class="box-art" x="335" y="28" width="270" height="78" rx="6"></rect>
      <text class="st at" x="351" y="50">athens · 2026-06-28</text>
      <text class="sl" x="351" y="70">14,337 listings</text>
      <text class="sm" x="351" y="88">listings · calendar · reviews · nbhds</text>

      <rect class="box-art" x="645" y="28" width="270" height="78" rx="6"></rect>
      <text class="st at" x="661" y="50">crete · 2026-06-29</text>
      <text class="sl" x="661" y="70">27,333 listings</text>
      <text class="sm" x="661" y="88">listings · calendar · reviews · nbhds</text>

      <line class="flow" x1="160" y1="106" x2="160" y2="142" marker-end="url(#arrowhead)"></line>
      <line class="flow" x1="470" y1="106" x2="470" y2="142" marker-end="url(#arrowhead)"></line>
      <line class="flow" x1="780" y1="106" x2="780" y2="142" marker-end="url(#arrowhead)"></line>

      <rect class="cnt" x="25" y="146" width="890" height="300" rx="10"></rect>
      <text class="st" x="45" y="170">data/build.py</text>
      <text class="sm" x="180" y="170">— the orchestrator: per city × entity, listings first · the only writer of data/processed/</text>

      <rect class="box-mod" x="45" y="192" width="260" height="98" rx="6"></rect>
      <text class="st" x="59" y="212">io.py — load_raw</text>
      <text class="sl" x="59" y="231">ID dtypes pinned: int64, raises on null</text>
      <text class="sl" x="59" y="247">license read as string (leading zeros)</text>
      <text class="sm" x="59" y="263">filename derived from the download URL</text>

      <rect class="box-mod" x="335" y="192" width="260" height="98" rx="6"></rect>
      <text class="st" x="349" y="212">anonymize.py</text>
      <text class="sl" x="349" y="231">PII dropped · ids → salted SHA-256, 12 hex</text>
      <text class="sl" x="349" y="247">nulls never hashed · same salt everywhere</text>
      <text class="sm" x="349" y="263">derives host_is_local · license_status + hash</text>

      <rect class="box-mod" x="625" y="192" width="260" height="98" rx="6"></rect>
      <text class="st" x="639" y="212">clean.py</text>
      <text class="sl" x="639" y="231">prices, dates, booleans, amenities parsed</text>
      <text class="sl" x="639" y="247">bathrooms from text · tenure months derived</text>
      <text class="sm" x="639" y="263">dedup on id = only row drop · else warn + keep</text>

      <line class="flow" x1="305" y1="241" x2="331" y2="241" marker-end="url(#arrowhead)"></line>
      <line class="flow" x1="595" y1="241" x2="621" y2="241" marker-end="url(#arrowhead)"></line>

      <text class="gt" x="45" y="322">cross-frame gates — each raises, never warns</text>

      <rect class="box-gate" x="45" y="332" width="260" height="94" rx="6"></rect>
      <text class="st-plain" x="59" y="352" style="font-size:12px">schema equality across cities</text>
      <text class="sl" x="59" y="371">columns must match the first city before</text>
      <text class="sl" x="59" y="387">concat — drift would union silently and</text>
      <text class="sl" x="59" y="403">widen the table with nulls</text>

      <rect class="box-gate" x="335" y="332" width="260" height="94" rx="6"></rect>
      <text class="st-plain" x="349" y="352" style="font-size:12px">listing ids disjoint across cities</text>
      <text class="sl" x="349" y="371">no 12-hex digest may appear in two</text>
      <text class="sl" x="349" y="387">markets — a collision silently merges</text>
      <text class="sl" x="349" y="403">two listings in every downstream join</text>

      <rect class="box-gate" x="625" y="332" width="260" height="94" rx="6"></rect>
      <text class="st-plain" x="639" y="352" style="font-size:12px">join integrity ≥ 99 %</text>
      <text class="sl" x="639" y="371">calendar &amp; review listing_ids must resolve;</text>
      <text class="sl" x="639" y="387">salt or dtype drift resolves nothing at all</text>
      <text class="sl" x="639" y="403">known: 5 + 1 Athens orphan ids → warn</text>

      <line class="flow" x1="470" y1="446" x2="470" y2="482" marker-end="url(#arrowhead)"></line>
      <text class="lab" x="482" y="468">write per entity, then release memory</text>

      <rect class="box-art" x="25" y="486" width="270" height="72" rx="6"></rect>
      <text class="st at" x="41" y="510">listings.parquet</text>
      <text class="sl" x="41" y="530">46,635 × 58</text>
      <text class="sm" x="41" y="546">+ city and per-row scrape_date</text>

      <rect class="box-art" x="335" y="486" width="270" height="72" rx="6"></rect>
      <text class="st at" x="351" y="510">calendar.parquet</text>
      <text class="sl" x="351" y="530">17,023,611 × 3</text>
      <text class="sm" x="351" y="546">listing_id · date · available</text>

      <rect class="box-art" x="645" y="486" width="270" height="72" rx="6"></rect>
      <text class="st at" x="661" y="510">reviews.parquet</text>
      <text class="sl" x="661" y="530">1,765,618 × 4</text>
      <text class="sm" x="661" y="546">listing_id · id · date · comments</text>

      <text class="cap" x="25" y="586">data/processed/ — one parquet per entity, cities concatenated · local only: never committed, never registered</text>
    </svg>