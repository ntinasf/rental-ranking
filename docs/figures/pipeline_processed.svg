<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="940" height="600" viewBox="0 0 940 600" role="img"
         aria-label="Three raw city snapshots flow through io, anonymize and clean inside the data/build.py orchestrator, past three cross-frame gates, into three processed parquet files.">
<style><![CDATA[
:root {
    --bg: #f5f6f4;
    --surface: #ffffff;
    --ink: #212a2e;
    --muted: #5b6a71;
    --line: #d8dedb;
    --flow: #74838a;
    --accent: #14688e;
    --accent-tint: #edf3f6;
    --artifact: #8a6410;
    --artifact-tint: #f7f0dd;
    --gate: #9c3f36;
    --gate-tint: #f7e9e6;
    --ok: #2e7d4f;
    --ok-tint: #e7f1ea;
    --warn: #a3660f;
    --warn-tint: #f7efdc;
    --display: "Avenir Next", "Avenir", "Segoe UI", system-ui, -apple-system, sans-serif;
    --body: "Avenir Next", "Avenir", "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  body {
    background: #f5f6f4;
    color: #212a2e;
    font-family: "Avenir Next", "Avenir", "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size: 15.5px;
    line-height: 1.55;
    margin: 0;
    padding: 0 20px 64px;
  }
  .wrap { max-width: 1060px; margin: 0 auto; }

  header.masthead { padding: 44px 0 8px; border-bottom: 2px solid #212a2e; }
  .eyebrow {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    font-size: 11.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #14688e;
  }
  h1 {
    font-family: "Avenir Next", "Avenir", "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size: clamp(30px, 5vw, 42px);
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 6px 0 10px;
    text-wrap: balance;
  }
  .standfirst { max-width: 68ch; color: #5b6a71; margin: 0 0 18px; }
  .stamps { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 22px; }
  .stamp {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    font-size: 11.5px;
    padding: 4px 10px;
    border: 1px solid #d8dedb;
    border-radius: 999px;
    background: #ffffff;
    color: #5b6a71;
    white-space: nowrap;
  }
  .stamp.good { border-color: #2e7d4f; color: #2e7d4f; background: #e7f1ea; }

  section { margin-top: 44px; }
  .kicker {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    font-size: 11.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #14688e;
    margin: 0 0 4px;
  }
  h2 {
    font-family: "Avenir Next", "Avenir", "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size: 24px;
    font-weight: 700;
    margin: 0 0 8px;
    text-wrap: balance;
  }
  section > p { max-width: 70ch; }
  p.note { color: #5b6a71; font-size: 14px; max-width: 76ch; }

  figure { margin: 18px 0 0; }
  .scroll { overflow-x: auto; padding-bottom: 6px; }
  .scroll svg { min-width: 900px; width: 100%; height: auto; display: block; }
  figcaption { font-size: 13.5px; color: #5b6a71; max-width: 78ch; margin-top: 8px; }

  /* SVG vocabulary */
  .box-mod  { fill: #ffffff; stroke: #14688e; stroke-width: 1.4; }
  .box-art  { fill: #f7f0dd; stroke: #8a6410; stroke-width: 1.4; }
  .box-gate { fill: #f7e9e6; stroke: #9c3f36; stroke-width: 1.2; }
  .box-note { fill: #edf3f6; stroke: #14688e; stroke-width: 1; stroke-dasharray: 3 3; }
  .cnt      { fill: none; stroke: #14688e; stroke-width: 1.1; stroke-dasharray: 6 5; opacity: 0.75; }
  .flow     { stroke: #74838a; stroke-width: 1.3; fill: none; }
  .tie      { stroke: #74838a; stroke-width: 1; stroke-dasharray: 2.5 3; fill: none; }
  #arrowhead path { fill: #74838a; }
  svg text  { font-family: "Avenir Next", "Avenir", "Segoe UI", system-ui, -apple-system, sans-serif; fill: #212a2e; }
  .st  { font-size: 12.5px; font-weight: 600; font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace; }
  .st-plain { font-size: 12.5px; font-weight: 600; }
  .sl  { font-size: 11.2px; }
  .sm  { font-size: 11.2px; fill: #5b6a71; }
  .lab { font-size: 10.6px; fill: #5b6a71; font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace; }
  .cap { font-size: 11.4px; fill: #5b6a71; }
  .gt  { fill: #9c3f36; font-weight: 600; font-size: 11.6px; }
  .at  { fill: #8a6410; }
  .nt  { fill: #14688e; font-weight: 600; font-size: 11.6px; }

  /* Column census bar */
  .census { margin-top: 16px; }
  .bar { display: flex; height: 40px; border: 1px solid #d8dedb; border-radius: 6px; overflow: hidden; background: #ffffff; }
  .seg { min-width: 14px; border-right: 1px solid #f5f6f4; }
  .seg:last-child { border-right: none; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; font-size: 13px; }
  .legend span { display: inline-flex; align-items: center; gap: 7px; color: #5b6a71; }
  .legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .legend b { color: #212a2e; font-weight: 600; font-variant-numeric: tabular-nums; }

  table { border-collapse: collapse; width: 100%; font-size: 13.5px; margin-top: 14px; }
  .tablewrap { overflow-x: auto; }
  th {
    text-align: left; font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 0.1em;
    text-transform: uppercase; color: #5b6a71; font-weight: 600;
    padding: 8px 14px 8px 0; border-bottom: 2px solid #212a2e;
  }
  td { padding: 8px 14px 8px 0; border-bottom: 1px solid #d8dedb; vertical-align: top; }
  td.mono, .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace; font-size: 12.5px; }
  td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr.grp td {
    border-bottom: 1px solid #d8dedb; padding-top: 18px;
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 0.12em;
    text-transform: uppercase; color: #14688e; font-weight: 600;
  }
  .ok-mark { color: #2e7d4f; font-weight: 700; }

  .findings { display: grid; gap: 12px; margin-top: 16px; }
  .finding {
    border: 1px solid #d8dedb; border-left: 4px solid #a3660f;
    background: #ffffff; border-radius: 6px; padding: 12px 16px; font-size: 14px;
  }
  .finding b { font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace; font-size: 12.5px; }
  .finding p { margin: 6px 0 0; color: #5b6a71; max-width: 90ch; }

  .cmds { background: #ffffff; border: 1px solid #d8dedb; border-radius: 6px;
          padding: 14px 18px; font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace; font-size: 12.5px; line-height: 1.9;
          overflow-x: auto; margin-top: 14px; white-space: pre; }
  .cmds i { color: #5b6a71; font-style: normal; }

  footer { margin-top: 52px; padding-top: 16px; border-top: 1px solid #d8dedb;
           font-size: 13px; color: #5b6a71; }
  a { color: #14688e; }
  a:focus-visible { outline: 2px solid #14688e; outline-offset: 2px; }
]]></style>
      <defs>
        <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z"></path>
        </marker>
      </defs>

      <text class="cap" x="25" y="16">data/raw/&lt;city&gt;/&lt;release&gt;/ — immutable · fetched + sha256-manifested by download.py · registered as Azure assets raw-&lt;city&gt;</text>

      <rect class="box-art" x="25" y="28" width="270" height="78" rx="6"></rect>
      <text class="st at" x="41" y="50">thessaloniki · 2026-06-29</text>
      <text class="sl" x="41" y="70">4,965 listings</text>
      <text class="sm" x="41" y="88">listings · calendar · reviews · nbhds</text>

      <rect class="box-art" x="335" y="28" width="270" height="78" rx="6"></rect>
      <text class="st at" x="351" y="50">athens · 2026-06-28</text>
      <text class="sl" x="351" y="70">14,337 listings</text>
      <text class="sm" x="351" y="88">listings · calendar · reviews · nbhds</text>

      <rect class="box-art" x="645" y="28" width="270" height="78" rx="6"></rect>
      <text class="st at" x="661" y="50">crete · 2026-06-29</text>
      <text class="sl" x="661" y="70">27,333 listings</text>
      <text class="sm" x="661" y="88">listings · calendar · reviews · nbhds</text>

      <line class="flow" x1="160" y1="106" x2="160" y2="142" marker-end="url(#arrowhead)"></line>
      <line class="flow" x1="470" y1="106" x2="470" y2="142" marker-end="url(#arrowhead)"></line>
      <line class="flow" x1="780" y1="106" x2="780" y2="142" marker-end="url(#arrowhead)"></line>

      <rect class="cnt" x="25" y="146" width="890" height="300" rx="10"></rect>
      <text class="st" x="45" y="170">data/build.py</text>
      <text class="sm" x="180" y="170">— the orchestrator: per city × entity, listings first · the only writer of data/processed/</text>

      <rect class="box-mod" x="45" y="192" width="260" height="98" rx="6"></rect>
      <text class="st" x="59" y="212">io.py — load_raw</text>
      <text class="sl" x="59" y="231">ID dtypes pinned: int64, raises on null</text>
      <text class="sl" x="59" y="247">license read as string (leading zeros)</text>
      <text class="sm" x="59" y="263">filename derived from the download URL</text>

      <rect class="box-mod" x="335" y="192" width="260" height="98" rx="6"></rect>
      <text class="st" x="349" y="212">anonymize.py</text>
      <text class="sl" x="349" y="231">PII dropped · ids → salted SHA-256, 12 hex</text>
      <text class="sl" x="349" y="247">nulls never hashed · same salt everywhere</text>
      <text class="sm" x="349" y="263">derives host_is_local · license_status + hash</text>

      <rect class="box-mod" x="625" y="192" width="260" height="98" rx="6"></rect>
      <text class="st" x="639" y="212">clean.py</text>
      <text class="sl" x="639" y="231">prices, dates, booleans, amenities parsed</text>
      <text class="sl" x="639" y="247">bathrooms from text · tenure months derived</text>
      <text class="sm" x="639" y="263">dedup on id = only row drop · else warn + keep</text>

      <line class="flow" x1="305" y1="241" x2="331" y2="241" marker-end="url(#arrowhead)"></line>
      <line class="flow" x1="595" y1="241" x2="621" y2="241" marker-end="url(#arrowhead)"></line>

      <text class="gt" x="45" y="322">cross-frame gates — each raises, never warns</text>

      <rect class="box-gate" x="45" y="332" width="260" height="94" rx="6"></rect>
      <text class="st-plain" x="59" y="352" style="font-size:12px">schema equality across cities</text>
      <text class="sl" x="59" y="371">columns must match the first city before</text>
      <text class="sl" x="59" y="387">concat — drift would union silently and</text>
      <text class="sl" x="59" y="403">widen the table with nulls</text>

      <rect class="box-gate" x="335" y="332" width="260" height="94" rx="6"></rect>
      <text class="st-plain" x="349" y="352" style="font-size:12px">listing ids disjoint across cities</text>
      <text class="sl" x="349" y="371">no 12-hex digest may appear in two</text>
      <text class="sl" x="349" y="387">markets — a collision silently merges</text>
      <text class="sl" x="349" y="403">two listings in every downstream join</text>

      <rect class="box-gate" x="625" y="332" width="260" height="94" rx="6"></rect>
      <text class="st-plain" x="639" y="352" style="font-size:12px">join integrity ≥ 99 %</text>
      <text class="sl" x="639" y="371">calendar &amp; review listing_ids must resolve;</text>
      <text class="sl" x="639" y="387">salt or dtype drift resolves nothing at all</text>
      <text class="sl" x="639" y="403">known: 5 + 1 Athens orphan ids → warn</text>

      <line class="flow" x1="470" y1="446" x2="470" y2="482" marker-end="url(#arrowhead)"></line>
      <text class="lab" x="482" y="468">write per entity, then release memory</text>

      <rect class="box-art" x="25" y="486" width="270" height="72" rx="6"></rect>
      <text class="st at" x="41" y="510">listings.parquet</text>
      <text class="sl" x="41" y="530">46,635 × 58</text>
      <text class="sm" x="41" y="546">+ city and per-row scrape_date</text>

      <rect class="box-art" x="335" y="486" width="270" height="72" rx="6"></rect>
      <text class="st at" x="351" y="510">calendar.parquet</text>
      <text class="sl" x="351" y="530">17,023,611 × 3</text>
      <text class="sm" x="351" y="546">listing_id · date · available</text>

      <rect class="box-art" x="645" y="486" width="270" height="72" rx="6"></rect>
      <text class="st at" x="661" y="510">reviews.parquet</text>
      <text class="sl" x="661" y="530">1,765,618 × 4</text>
      <text class="sm" x="661" y="546">listing_id · id · date · comments</text>

      <text class="cap" x="25" y="586">data/processed/ — one parquet per entity, cities concatenated · local only: never committed, never registered</text>
    </svg>