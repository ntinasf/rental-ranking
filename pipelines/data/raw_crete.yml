$schema: https://azuremlschemas.azureedge.net/latest/data.schema.json

# Raw Inside Airbnb snapshot, one asset per city per release. See raw_thessaloniki.yml for the
# versioning rationale.
#
# Register:  az ml data create -f pipelines/data/raw_crete.yml \
#              -g nf-rental-ranking -w nf-rental-ranking-ws

type: uri_folder
name: raw-crete
version: "2026.06.29"
description: >-
  Inside Airbnb Crete snapshot 2026-06-29 — listings, calendar, reviews, neighbourhoods, plus
