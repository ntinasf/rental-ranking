$schema: https://azuremlschemas.azureedge.net/latest/data.schema.json

# Raw Inside Airbnb snapshot, one asset per city per release.
#
# `path` is resolved relative to THIS file, not to the working directory.
# Version is the snapshot date: the only fact that distinguishes one raw pull from another,
# and it never changes once downloaded. These files are immutable, so this YAML is written
# once and never edited — a new snapshot is a new version, not a new path here.
#
# Register:  az ml data create -f pipelines/data/raw_thessaloniki.yml \
#              -g nf-rental-ranking -w nf-rental-ranking-ws

type: uri_folder
name: raw-thessaloniki
version: "2026.06.29"
description: >-
  Inside Airbnb Thessaloniki snapshot 2026-06-29 — listings, calendar, reviews, neighbourhoods,
  plus manifest.json carrying the source URLs and SHA-256 of each file. Unmodified as downloaded;
  host and reviewer PII is stripped downstream by data/anonymize.py, not here.
path: ../../data/raw/thessaloniki/2026-06-29

tags:
  city: thessaloniki
  snapshot_date: "2026-06-29"
  source: insideairbnb.com
  license: CC-BY-4.0
  contains_pii: "true"
  layer: raw
