[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rental-ranking"
version = "0.1.0"
description = "Two-stage search ranking (retrieval -> ranking) for short-term rental listings using Inside Airbnb data, on Azure ML."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "lightgbm",
    "mlflow",
    "azure-ai-ml",
    "matplotlib",
    "seaborn",
    "pyarrow>=24.0.0",
    "scipy>=1.17.1",
    "azure-ai-textanalytics>=5.4.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["data_preprocessing.py", "eda_functions.py"]

[tool.ruff.lint]
extend-select = ["I"]
