[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rental-ranking"
version = "0.1.0"
description = "Two-stage search ranking (retrieval -> ranking) for short-term rental listings using Inside Airbnb data, on Azure ML."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "lightgbm",
    "mlflow",
    "azure-ai-ml",
    "pytest",
    "matplotlib",
    "seaborn",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
